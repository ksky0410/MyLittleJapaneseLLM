[paths]
prepared_dir = "artifacts/corpus/mixed-ja-token-budget-fineweb2-wikipedia-balanced-40m-v1"
tokenizer_model = "artifacts/tokenizer/mixed-ja-80-10-10-v2-unigram.model"
train_tokens = "artifacts/tokens/mixed-ja-token-budget-fineweb2-wikipedia-balanced-40m-v1-train.bin"
val_tokens = "artifacts/tokens/fineweb2-edu-japanese-v1-test.bin"
checkpoint_dir = "artifacts/checkpoints/issue1-both-50m-pretrain-balanced-40m-runpod-5k"
samples_dir = "artifacts/samples/issue1-both-50m-pretrain-balanced-40m-runpod-5k"

[model]
dim = 576
layers = 12
heads = 9
context_length = 256
mlp_ratio = 4
position_embedding = "rope"
norm_type = "layernorm"
ffn_type = "swiglu"

[training]
batch_size = 8
max_steps = 5000
eval_interval = 500
sample_interval = 500
checkpoint_interval = 1000
eval_batches = 20
learning_rate = 0.00001
min_learning_rate = 0.000001
warmup_steps = 250
weight_decay = 0.1
seed = 104

[generation]
prompt = "今日はなにをしていましたか？"
max_new_tokens = 160
temperature = 0.8
top_k = 40
