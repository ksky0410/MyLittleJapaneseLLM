[paths]
prepared_dir = "artifacts/corpus/mixed-ja-token-budget-fineweb2-5m-v1"
tokenizer_model = "artifacts/tokenizer/mixed-ja-80-10-10-v2-unigram.model"
train_tokens = "artifacts/tokens/mixed-ja-token-budget-fineweb2-5m-v1-train.bin"
val_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-general-val.bin"
checkpoint_dir = "artifacts/checkpoints/issue1-both-50m-pretrain-5m-2p5k"
samples_dir = "artifacts/samples/issue1-both-50m-pretrain-5m-2p5k"

[model]
dim = 576
layers = 12
heads = 9
context_length = 256
mlp_ratio = 4
position_embedding = "rope"
norm_type = "layernorm"
ffn_type = "swiglu"

[training]
batch_size = 8
max_steps = 2500
eval_interval = 100
sample_interval = 100
checkpoint_interval = 500
eval_batches = 20
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 300
weight_decay = 0.1
seed = 42

[generation]
prompt = "今日なにしてた？"
max_new_tokens = 160
temperature = 0.8
top_k = 40
