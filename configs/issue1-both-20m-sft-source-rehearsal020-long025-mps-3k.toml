[paths]
prepared_dir = "artifacts/corpus/conversation-v1"
tokenizer_model = "artifacts/tokenizer/mixed-ja-80-10-10-v2-unigram.model"
train_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-train.bin"
val_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-general-val.bin"
checkpoint_dir = "artifacts/checkpoints/issue1-both-20m-sft-source-rehearsal020-long025-mps-3k"
samples_dir = "artifacts/samples/issue1-both-20m-sft-source-rehearsal020-long025-mps-3k"

[model]
dim = 384
layers = 10
heads = 6
context_length = 256
mlp_ratio = 4
position_embedding = "rope"
norm_type = "layernorm"
ffn_type = "swiglu"

[training]
batch_size = 8
max_steps = 3000
eval_interval = 100
sample_interval = 100
checkpoint_interval = 500
eval_batches = 20
learning_rate = 0.00005
min_learning_rate = 0.000005
warmup_steps = 100
weight_decay = 0.01
seed = 42

[generation]
prompt = "こんにちは！"
max_new_tokens = 160
temperature = 0.8
top_k = 40
