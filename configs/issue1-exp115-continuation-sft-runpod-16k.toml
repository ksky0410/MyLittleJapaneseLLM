[paths]
prepared_dir = "artifacts/corpus/conversation-v1"
tokenizer_model = "artifacts/tokenizer/mixed-ja-80-10-10-v2-unigram.model"
train_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-train.bin"
val_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-general-val.bin"
checkpoint_dir = "artifacts/checkpoints/issue1-exp115-continuation-sft-runpod-16k"
samples_dir = "artifacts/samples/issue1-exp115-continuation-sft-runpod-16k"

[model]
dim = 576
layers = 12
heads = 9
context_length = 256
mlp_ratio = 4
position_embedding = "rope"
norm_type = "layernorm"
ffn_type = "swiglu"

[training]
batch_size = 8
max_steps = 16000
eval_interval = 250
sample_interval = 250
checkpoint_interval = 500
eval_batches = 20
learning_rate = 0.000002
min_learning_rate = 0.0000002
warmup_steps = 0
weight_decay = 0.01
seed = 116

[generation]
prompt = "今日は天気がいいですね。"
max_new_tokens = 160
temperature = 0.8
top_k = 40
