[paths]
prepared_dir = "artifacts/corpus/issue1-rpc-1m-fineweb.txt"
tokenizer_model = "artifacts/tokenizer/mixed-ja-80-10-10-v2-unigram.model"
train_tokens = "artifacts/tokens/issue1-rpc-1m-fineweb-train.bin"
val_tokens = "artifacts/tokens/mixed-ja-80-10-10-v2-general-val.bin"
checkpoint_dir = "artifacts/checkpoints/issue1-rpc-5m-smoke"
samples_dir = "artifacts/samples/issue1-rpc-5m-smoke"

[model]
dim = 240
layers = 6
heads = 6
context_length = 256
mlp_ratio = 4
position_embedding = "absolute"
norm_type = "layernorm"
ffn_type = "gelu"

[training]
batch_size = 8
max_steps = 500
eval_interval = 100
sample_interval = 100
checkpoint_interval = 500
eval_batches = 20
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 50
weight_decay = 0.1
seed = 42

[generation]
prompt = "今日なにしてた？"
max_new_tokens = 128
temperature = 0.8
top_k = 40
